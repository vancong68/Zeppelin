# Render.com Blueprint
# Deploy with: https://render.com/docs/blueprint-spec
#
# Creates three FREE services:
#   - zeppelin-bot       (web service - free plan does not allow background workers)
#   - zeppelin-api       (web service)
#   - zeppelin-dashboard (web service)
#
# Prerequisites:
# - External MySQL database (Render does not offer managed MySQL)
# - The "zeppelin-shared" env group (created empty by this Blueprint; values
#   are added in the Render Dashboard - see RENDER.md)

# Shared environment variables group.
# Created empty by this Blueprint. After the first deploy, go to
# Render Dashboard > Env Groups > "zeppelin-shared", paste the values,
# then redeploy the services. Values are intentionally NOT in this file
# (secrets must not be committed to Git; env groups do not support sync: false).
envVarGroups:
  - name: zeppelin-shared

services:
  # --- Bot (Web Service, free) ---
  # Free plan does not support background workers, so the bot runs as a web
  # service. It binds Render's PORT (health check) and stays awake while the
  # Discord gateway sends messages over the WebSocket connection.
  - type: web
    name: zeppelin-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bot
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: zeppelin-shared

  # --- API (Web Service) ---
  - type: web
    name: zeppelin-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: api
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: zeppelin-shared

  # --- Dashboard (Web Service) ---
  - type: web
    name: zeppelin-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: dashboard
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: zeppelin-shared